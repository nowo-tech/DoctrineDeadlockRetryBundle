name: doctrine-deadlock-retry-bundle-demo-symfony-7
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctrine-deadlock-retry-symfony7-php
    working_dir: /app
    ports:
      - "${PORT:-8017}:80"
    volumes:
      - .:/app
      - ../..:/var/doctrine-deadlock-retry-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - COMPOSER_MEMORY_LIMIT=-1
      - COMPOSER_MAX_PARALLEL_HTTP=4
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      # Demo uses SQLite (pdo_sqlite in Dockerfile). Do not interpolate a host Flex postgres URL.
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - doctrine-deadlock-retry-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  doctrine-deadlock-retry-demo-network:
    driver: bridge
