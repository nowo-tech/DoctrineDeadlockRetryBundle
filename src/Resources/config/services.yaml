services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\DoctrineDeadlockRetryBundle\Failure\TransientFailureClassifier: ~

  Nowo\DoctrineDeadlockRetryBundle\Connection\ConnectionRepairer: ~

  Nowo\DoctrineDeadlockRetryBundle\Sleep\UsleepSleeper: ~

  # Alias it to your own implementation to replace how the service waits between attempts.
  Nowo\DoctrineDeadlockRetryBundle\Sleep\SleeperInterface: '@Nowo\DoctrineDeadlockRetryBundle\Sleep\UsleepSleeper'

  Nowo\DoctrineDeadlockRetryBundle\Service\DeadlockRetryService:
    arguments:
      $profiles: []
      $defaultProfile: 'default'
      $managerRegistry: '@?doctrine'
      $logger: '@?logger'
      $randomizer: null
      $sleeper: '@Nowo\DoctrineDeadlockRetryBundle\Sleep\SleeperInterface'

  Nowo\DoctrineDeadlockRetryBundle\Contract\DeadlockRetryInterface: '@Nowo\DoctrineDeadlockRetryBundle\Service\DeadlockRetryService'
